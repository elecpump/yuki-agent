[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "yuki"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = ["pyzmq>=25", "structlog>=24", "pydantic>=2", "PyYAML>=6",
                "protobuf>=7.35.1,<8", "numpy>=1.26", "Pillow>=10", "psutil>=5.9",
                "webrtcvad-wheels>=2.0.12"]

[project.optional-dependencies]
windows = [
    "windows-capture>=2.0",
    "sounddevice>=0.5",
    "comtypes>=1.2",
    "uiautomation>=2",
    "pywin32>=306",
                "webrtcvad-wheels>=2.0.12"]

dev = ["pytest>=8", "grpcio-tools>=1.66"]
ml = ["transformers", "torch", "torchvision", "qwen-vl-utils", "funasr", "paddleocr",
      "accelerate", "bitsandbytes"]
asr = ["openwakeword", "onnxruntime", "funasr"]
desktop = ["fastapi", "uvicorn[standard]", "websockets"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["-m", "not e2e", "--import-mode=importlib"]
markers = ["e2e: end-to-end integration test that spawns real processes"]

[tool.ruff]
line-length = 100
target-version = "py311"
