[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "yuki"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = ["pyzmq>=25", "structlog>=24", "pydantic>=2", "PyYAML>=6", "protobuf>=6.33.5",
                "windows-capture>=2.0", "sounddevice>=0.5", "numpy>=1.26", "comtypes>=1.2",
                "uiautomation>=2"]

[project.optional-dependencies]
dev = ["pytest>=8", "Pillow>=10", "grpcio-tools>=1.66"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["-m", "not e2e"]
markers = ["e2e: end-to-end integration test that spawns real processes"]
