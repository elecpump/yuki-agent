[package]
name = "yuki-desktop"
version = "0.1.0"
description = "Yuki desktop companion"
authors = ["Yuki contributors"]
edition = "2021"

[lib]
name = "yuki_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
serde_json = "1"
tauri = { version = "2", features = [] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_System_Console"] }
