# Yuki Agent 配置样例。复制为 config.yaml 使用；环境变量 YUKI_<SECTION>_<FIELD> 覆盖同级项。
persona_name: yuki
bus:
  base_port: 5555
  hwm: 1000
  auth_token: ""
  max_msg_size: 10485760
logging:
  level: INFO
supervisor:
  restart_base_delay: 1.0
  restart_max_delay: 60.0
  restart_window: 600
  restart_max_per_window: 5
health:
  timeout_ms: 2000
  heartbeat_interval_s: 5.0
memory:
  db_path: data/yuki.db
  decay_base: 1.0
  decay_lambda: 0.1
  decay_threshold: 0.02
  short_term_ttl_s: 1800
  short_term_capacity: 50
  cleanup_interval_s: 300.0
  vector_enabled: false
  embedding_provider: hashing
  embedding_model: hashing-v1
  embedding_dimension: 384
  vector_candidates: 30
  lexical_weight: 0.45
  vector_weight: 0.45
  confidence_weight: 0.10
text:
  enabled: true
  dom_enabled: true
  uia_enabled: true
  ocr_enabled: false
  ttl_s: 2.0
  max_chars: 50000
  summary_chars: 500
  key_point_chars: 160
  provider_timeout_ms: 80
  ocr_timeout_ms: 250
brain:
  proactive_cooldown_s: 120.0
  proactive_enabled: true
cloud:
  enabled: false
  base_url: https://api.deepseek.com/v1
  model: deepseek-v4-flash
  api_key_env: YUKI_CLOUD_API_KEY
  timeout_s: 10.0
  max_turns: 3
soul:
  path: data/soul.json
context:
  max_turns: 20
  max_tokens: 1500
  verbatim_turns: 4
  snapshot_path: data/context_snapshot.json
sedimenter:
  min_signals: 3
  confidence_threshold: 0.6
  topic_engagement_threshold: 3
persona:
  prompt: "你是{persona},一个温柔的中文语音陪伴 agent。回复简短自然(1-3 句),贴合陪伴场景。不替用户操作系统或浏览器。用户提到自伤/自杀等危机时,优先表达关怀并建议求助。可以用工具查询记忆,但不要捏造记忆内容。"
  max_versions: 50
  enable_llm_refine: false
  snapshots_path: data/persona_snapshots.json
