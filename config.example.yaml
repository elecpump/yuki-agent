# Yuki Agent 配置样例。复制为 config.yaml 使用；环境变量 YUKI_<SECTION>_<FIELD> 覆盖同级项。
persona_name: yuki
bus:
  base_port: 5555
  hwm: 1000
  auth_token: ""
  max_msg_size: 10485760
  register_interval_s: 10.0
logging:
  level: INFO
supervisor:
  restart_base_delay: 1.0
  restart_max_delay: 60.0
  restart_window: 600
  restart_max_per_window: 5
  startup_grace_s: 20.0
  bus_recovery_grace_s: 20.0
models:
  gpu_max_concurrency: 1
  interactive_queue_size: 32
  background_queue_size: 16
  drain_timeout_s: 10.0
  operation_ttl_s: 300.0
  circuit_breaker_s: 30.0
  oom_retry: 1
  vram_safety_margin_mb: 512
  vram_hysteresis_mb: 256
  policies:
    local_chat: {priority: 100, warmup: true, evictable: false, pinned: true}
    stt: {priority: 90, warmup: true, evictable: false, pinned: true}
    tts: {priority: 80, warmup: true, evictable: true, pinned: false}
    vlm: {priority: 30, warmup: false, evictable: true, pinned: false}
    embedding: {priority: 10, warmup: false, evictable: true, pinned: false}
runtime_bus:
  subscriber_queue_size: 256
  mirror_queue_size: 1024
  mirror_topic_prefixes: [""]
health:
  timeout_ms: 2000
  heartbeat_interval_s: 5.0
memory:
  db_path: data/yuki.db
  decay_base: 1.0
  decay_lambda: 0.1
  decay_threshold: 0.02
  short_term_ttl_s: 1800
  short_term_capacity: 50
  cleanup_interval_s: 300.0
  vector_enabled: false
  embedding_provider: hashing
  embedding_model: hashing-v1
  embedding_dimension: 384
  embedding_cache_dir: ""     # sentence-transformers 的 HF 缓存目录（如 .model）；hashing 不用
  embedding_device: auto      # auto | cpu | cuda:0；sentence-transformers provider
  # 语义 embedding 示例（需安装 ml extra，本地模型放 cache dir）：
  #   embedding_provider: sentence-transformers
  #   embedding_model: Qwen/Qwen3-Embedding-0.6B
  #   embedding_cache_dir: .model
  #   embedding_device: auto
  vector_candidates: 30
  # 检索模式：BM25（FTS5）与向量双路召回，合并后按向量相似度 × 衰减重排取 top_k。
  # BM25 只负责召回候选；仅 BM25 命中的记忆排在向量命中之后，不足 top_k 时兜底。
text:
  enabled: true
  dom_enabled: true
  uia_enabled: true
  ocr_enabled: false
  ttl_s: 2.0
  max_chars: 50000
  summary_chars: 500
  key_point_chars: 160
  provider_timeout_ms: 80
  ocr_timeout_ms: 250
brain:
  proactive_cooldown_s: 120.0
  proactive_enabled: true
  proactive_timeout_s: 5.0
  proactive_tick_s: 30.0
  proactive_max_chars: 200
  activity_suppress_s: 30.0
  dedup_min_interval_s: 30.0
  silent_hold_s: 300.0
  max_cooldown_s: 600.0
local_brain:
  enabled: false
  model_id: Qwen/Qwen3-1.7B-FP8
  cache_dir: ""
  device: auto
  fp8_dequantize: true
  local_files_only: false
vlm:
  enabled: true
  model: Qwen/Qwen3-VL-8B-Instruct
  cache_dir: ""
  deep_interval_s: 300.0
  user_bypass_rate_limit: true
stt:
  enabled: true
  model: iic/SenseVoiceSmall
  model_dir: ""
  device: auto
  language: auto
  use_itn: true
  warmup: true
  retry_window_s: 60.0
  vad:
    model: fsmn-vad
    vad_interval_ms: 400
    end_silence_ms: 800
    max_utterance_s: 10.0
tts:
  enabled: false
  cfg_path: checkpoints/config.yaml
  model_dir: checkpoints
  use_bf16: true
  language: zh
  reference_audio_path: data/tts/reference_audio/default.wav
  chunk_size: 1024
  retry_window_s: 60.0
cloud:
  enabled: false
  base_url: https://api.deepseek.com/v1
  model: deepseek-v4-flash
  api_key_env: YUKI_CLOUD_API_KEY
  timeout_s: 10.0
  max_turns: 3  # deprecated: agent_loop.max_steps takes precedence
agent_loop:
  max_steps: 3
  max_duration_s: 15.0
  transition_enabled: true
  transition_fallback: "让我看一下……"
  transition_grace_s: 0.8
  tool_result_max_chars: 2000
  compact_threshold_tokens: 0
  interrupt_enabled: true
soul:
  path: data/soul.json
  cooldown_state_path: data/cooldown_state.json
perception:
  dwell_s: 2.0
wake_word:
  enabled: false
  model_path: ""
  threshold: 0.5
  refractory_s: 2.0
  chunk_ms: 80
  pre_roll_s: 1.2
  listen_timeout_s: 10.0
  listen_window_s: 5.0
gateway:
  enabled: false
  host: 127.0.0.1
  port: 8765
  cors_origins:
    - tauri://localhost
  cors_origin_regex: "^http://localhost:\\d+$"
  ws_heartbeat_timeout_s: 45.0
  cleanup_interval_s: 30.0
  chat_task_timeout_s: 60.0
  history_dir: data/recordings
thread:
  segment_max_turns: 20
  segment_verbatim_max: 20
  fallback_turns: 8
  episode_idle_s: 300
  maintenance_tick_s: 30
  shutdown_timeout_s: 3.0
  summary_failures_max: 3
  history_summary_max_segments: 8
  history_summary_max_tokens: 600
persona:
  prompt: "你是{persona},一个温柔的中文语音陪伴 agent。回复简短自然(1-3 句),贴合陪伴场景。不替用户操作系统或浏览器。用户提到自伤/自杀等危机时,优先表达关怀并建议求助。可以用工具查询记忆,但不要捏造记忆内容。"
  max_versions: 50
  enable_llm_refine: false
  snapshots_path: data/persona_snapshots.json
  refresh_every_utterances: 30
plugins:
  example_plugin:
    enabled: false
    options: {}
